<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar Test - Desktop and Mobile Views</title>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.9/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/multimonth@6.1.9/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.9/index.global.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .view-toggle {
            text-align: center;
            margin: 20px 0;
        }
        .view-toggle button {
            padding: 10px 20px;
            margin: 0 10px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .view-toggle button.active {
            background: #667eea;
            color: white;
        }
        #calendar {
            max-width: 1000px;
            margin: 20px auto;
        }
        
        /* Weekend styling - grayed-out */
        #calendar .fc-daygrid-day.fc-day-sat,
        #calendar .fc-daygrid-day.fc-day-sun {
            background: #f9f9f9;
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        /* Past days styling */
        #calendar .fc-daygrid-day.fc-day-past {
            background: #fafafa;
            opacity: 0.5;
            cursor: not-allowed;
            color: #999999;
        }
        
        .info {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 5px;
        }
        .info h3 {
            margin: 0 0 10px 0;
            color: #1976d2;
        }
        .info ul {
            text-align: left;
            display: inline-block;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Calendar UI Refinement Test</h1>
        
        <div class="info">
            <h3>Changes Implemented:</h3>
            <ul>
                <li><strong>Desktop:</strong> Shows 1 month (changed from 2 months side-by-side)</li>
                <li><strong>Mobile:</strong> Shows 2 weeks (unchanged)</li>
                <li><strong>Weekends:</strong> Visible but grayed-out (changed from hidden)</li>
                <li><strong>Weekend Selection:</strong> Disabled via selectAllow function</li>
            </ul>
        </div>
        
        <div class="view-toggle">
            <button id="desktopView" class="active">Desktop View (1 Month)</button>
            <button id="mobileView">Mobile View (2 Weeks)</button>
        </div>
        
        <div id="calendar"></div>
    </div>

    <script>
        let calendar;
        let currentView = 'desktop';
        
        function initCalendar(viewType) {
            const calendarEl = document.getElementById('calendar');
            
            if (calendar) {
                calendar.destroy();
            }
            
            const isMobileView = viewType === 'mobile';
            
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: isMobileView ? 'dayGridWeek' : 'multiMonthYear',
                initialDate: new Date(),
                locale: 'fi',
                views: {
                    multiMonthYear: {
                        type: 'multiMonth',
                        duration: { months: 1 }, // Show only 1 month (refined from 2)
                        multiMonthMaxColumns: 1 // Display single month
                    },
                    dayGridWeek: {
                        type: 'dayGrid',
                        duration: { weeks: 2 } // Mobile: show 2 weeks at a time
                    }
                },
                selectable: true,
                selectOverlap: false,
                expandRows: true,
                // Weekends are visible but grayed-out (selection disabled via selectAllow)
                displayEventTime: false,
                dayMaxEventRows: 3,
                height: 'auto',
                contentHeight: isMobileView ? 500 : 400,
                dayMaxEvents: true,
                selectMirror: true,
                unselectAuto: true,
                selectAllow: function(selectInfo) {
                    // Only allow weekday selections (Monday=1 to Friday=5)
                    const startDay = selectInfo.start.getDay(); // 0=Sunday, 1=Monday, etc.
                    return startDay >= 1 && startDay <= 5;
                },
                aspectRatio: isMobileView ? 1.2 : 1.35,
                eventDisplay: 'block',
                displayEventTime: true,
                headerToolbar: {
                    left: isMobileView ? 'prev' : '',
                    center: 'title',
                    right: isMobileView ? 'next' : ''
                },
                validRange: function() {
                    const now = new Date();
                    const startDate = new Date(now);
                    startDate.setHours(0, 0, 0, 0);
                    const endDate = new Date(now.getFullYear(), now.getMonth() + 2, 0);
                    endDate.setHours(23, 59, 59, 999);
                    return {
                        start: startDate,
                        end: endDate
                    };
                },
                select: function(info) {
                    alert('Selected: ' + info.start.toLocaleDateString());
                    calendar.unselect();
                },
                dateClick: function(info) {
                    const dayOfWeek = info.date.getDay();
                    if (dayOfWeek === 0 || dayOfWeek === 6) {
                        alert('Weekends are not selectable!');
                    }
                }
            });
            
            calendar.render();
        }
        
        // Initialize with desktop view
        initCalendar('desktop');
        
        // View toggle buttons
        document.getElementById('desktopView').addEventListener('click', function() {
            currentView = 'desktop';
            document.getElementById('desktopView').classList.add('active');
            document.getElementById('mobileView').classList.remove('active');
            initCalendar('desktop');
        });
        
        document.getElementById('mobileView').addEventListener('click', function() {
            currentView = 'mobile';
            document.getElementById('mobileView').classList.add('active');
            document.getElementById('desktopView').classList.remove('active');
            initCalendar('mobile');
        });
    </script>
</body>
</html>
