<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Calendar Test</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
        }
        
        /* Modern Dark-Themed Booking Calendar */
        .ajanvaraus-container {
            max-width: 1100px;
            margin: 30px auto;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 100px rgba(15,52,96,0.3);
            padding: 50px 40px;
            position: relative;
            overflow: hidden;
        }
        
        .ajanvaraus-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(26,26,46,0.95) 0%, rgba(15,52,96,0.9) 100%);
            z-index: 1;
            pointer-events: none;
        }
        
        .ajanvaraus-container > * {
            position: relative;
            z-index: 2;
        }
        
        .ajanvaraus-container h2 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #ffffff 0%, #e0e0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .booking-step {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            transition: all 0.3s ease;
        }
        
        .booking-step:hover {
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        
        .step-title {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .step-number {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }
        
        .form-select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(255,255,255,0.1);
            color: #ffffff;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .form-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
            background: rgba(255,255,255,0.15);
        }
        
        .price-display {
            margin: 25px 0;
            padding: 20px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
            border-radius: 16px;
            border: 2px solid rgba(102, 126, 234, 0.4);
            text-align: center;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }
        
        .price-display strong {
            font-size: 1.5rem;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        .price-amount {
            color: #a7f3d0;
            font-size: 1.8rem;
        }
    </style>
</head>
<body>
    <div class="ajanvaraus-container">
        <h2>Varaa aika silmäterällesi</h2>
        
        <div class="booking-step">
            <h3 class="step-title">
                <span class="step-number">1</span>
                Valitse palvelu
            </h3>
            <select class="form-select">
                <option>Valitse palvelu...</option>
                <option>Rengastyöt</option>
                <option>Korjaustyöt</option>
                <option>Pesupalvelut</option>
                <option>Kiillotus ja pinnoitteet</option>
                <option>Sisäpuhdistus</option>
            </select>
        </div>
        
        <div class="booking-step">
            <h3 class="step-title">
                <span class="step-number">2</span>
                Valitse päivä ja aika
            </h3>
            <p style="color: rgba(255,255,255,0.7); text-align: center; margin: 20px 0;">
                [Calendar would be displayed here]
            </p>
        </div>
        
        <div class="price-display">
            <strong>Arvioitu kokonaishinta: <span class="price-amount">150 €</span></strong>
        </div>
        
        <div class="booking-step">
            <h3 class="step-title">
                <span class="step-number">3</span>
                Yhteystiedot
            </h3>
            <p style="color: rgba(255,255,255,0.7);">
                [Contact form would be displayed here]
            </p>
        </div>
    </div>
</body>
</html>
